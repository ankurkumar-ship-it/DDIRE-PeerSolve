<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DDIRE-PeerSolve - Premium Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="keywords" content="Peer Solve, Draw, Drawing Board, Real-time Whiteboard">
    <meta name="author" content="Ankur">
    <meta name="google-site-verification" content="6jiXl6s2IAC-aG8T4irxKVlaAU4hgpy3pNOG39xYv3U" />
    <style>
        :root {
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.25);
            --danger: #ef4444;
            --info: #3b82f6;
            --warning: #f59e0b;
            --panel-bg: rgba(18, 18, 22, 0.88);
            --panel-border: rgba(255, 255, 255, 0.12);
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #000; 
            color: #f3f4f6; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* Prevent SVG icons from blocking button clicks */
        svg {
            pointer-events: none;
            flex-shrink: 0;
        }
        
        /* Super Glassmorphism Toolbars */
        .toolbar { 
            position: absolute; 
            top: 20px; 
            background: var(--panel-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 14px; 
            border-radius: 50px; 
            border: 1px solid var(--panel-border); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.08); 
            z-index: 10; 
            pointer-events: auto; 
        }
        #ui-left { left: 20px; max-width: calc(100vw - 40px); }
        #ui-right { right: 20px; max-width: calc(100vw - 40px); }
        
        .divider { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.14); flex-shrink: 0; }
        
        /* Color Swatches & Custom Picker */
        .color-wrapper { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .color-btn { 
            width: 24px; 
            height: 24px; 
            border-radius: 50%; 
            cursor: pointer; 
            border: 2px solid rgba(255,255,255,0.2); 
            transition: all 0.2s ease; 
            flex-shrink: 0; 
        }
        .color-btn.white { background: #ffffff; }
        .color-btn.red { background: #ef4444; }
        .color-btn.green { background: #10b981; }
        .color-btn.blue { background: #3b82f6; }
        .active-color { 
            border: 2px solid #fff; 
            transform: scale(1.18); 
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5); 
        }
        
        .color-picker-input {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            padding: 0;
            background: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-input::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; }

        /* Modern Tool & Action Buttons */
        .tools-wrapper { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .tool-btn, .action-btn { 
            background: var(--btn-bg); 
            color: #d1d5db; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 30px; 
            padding: 7px 13px; 
            font-size: 12.5px; 
            font-weight: 600; 
            letter-spacing: 0.2px;
            cursor: pointer; 
            transition: all 0.2s ease; 
            white-space: nowrap; 
            flex-shrink: 0; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .tool-btn:hover, .action-btn:hover { 
            background: var(--btn-hover); 
            color: #ffffff; 
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .active-tool { 
            border-color: var(--accent) !important; 
            color: var(--accent) !important; 
            background: var(--accent-glow) !important; 
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
        
        /* Clean Shape Dropdown Menu */
        #shape-menu { 
            display: none; 
            position: absolute; 
            top: 75px; 
            left: 210px; 
            background: var(--panel-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px; 
            border-radius: 16px; 
            border: 1px solid var(--panel-border); 
            z-index: 20; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
            box-shadow: 0 12px 35px rgba(0,0,0,0.85); 
        }
        .shape-btn { 
            background: var(--btn-bg); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: #e5e7eb; 
            padding: 9px 14px; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 12.5px; 
            font-weight: 600;
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        .shape-btn:hover { 
            background: var(--accent); 
            color: #000; 
            border-color: var(--accent); 
        }
        
        /* Brush Size Slider */
        .size-wrapper { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #9ca3af; flex-shrink: 0; padding: 0 4px; }
        input[type=range] { -webkit-appearance: none; width: 75px; background: transparent; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--accent); margin-top: -5px; box-shadow: 0 0 8px var(--accent); }
        
        /* Specialized Action Button Accents */
        .btn-room { color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
        .btn-room:hover { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: var(--warning); }
        
        .btn-save { color: var(--info); border-color: rgba(59, 130, 246, 0.3); }
        .btn-save:hover { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: var(--info); }
        
        .btn-clear { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
        .btn-clear:hover { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: var(--danger); }
        
        .btn-chat { border-color: var(--accent); color: var(--accent); position: relative; }
        .btn-chat:hover { background: var(--accent-glow); color: #34d399; }
        
        /* Notification Badge */
        #chat-badge {
            display: none; 
            position: absolute; 
            top: -5px; 
            right: -5px; 
            background: var(--danger); 
            color: white; 
            border-radius: 50%; 
            padding: 2px 6px; 
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        /* Modern Chat Container */
        #chat-container { 
            position: absolute; 
            right: 20px; 
            top: 75px; 
            bottom: 20px; 
            width: 330px; 
            background: var(--panel-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border); 
            border-radius: 18px; 
            display: none; 
            flex-direction: column; 
            pointer-events: auto; 
            z-index: 15; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.85); 
            overflow: hidden;
        }
        #chat-header { 
            background: rgba(255, 255, 255, 0.04); 
            padding: 14px 16px; 
            font-weight: 700; 
            font-size: 13.5px;
            border-bottom: 1px solid var(--panel-border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .close-chat-btn { 
            cursor: pointer; 
            color: #9ca3af; 
            font-size: 12px; 
            font-weight: 600;
            padding: 4px 10px; 
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            transition: 0.2s;
        }
        .close-chat-btn:hover { background: var(--danger); color: white; }
        
        #chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: rgba(255, 255, 255, 0.08); padding: 9px 13px; border-radius: 12px; font-size: 13px; align-self: flex-start; max-width: 85%; word-wrap: break-word; line-height: 1.4; }
        .msg.self { background: var(--accent); color: #000; align-self: flex-end; font-weight: 500; }
        .msg-sender { font-size: 10px; color: #9ca3af; margin-bottom: 3px; display: block; font-weight: 700; text-transform: uppercase; }
        .msg.self .msg-sender { color: #064e3b; text-align: right; }
        
        #chat-input-area { display: flex; padding: 12px; border-top: 1px solid var(--panel-border); gap: 8px; background: rgba(0,0,0,0.3); }
        #chat-input { flex-grow: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.6); color: white; outline: none; font-size: 13px; }
        #chat-input:focus { border-color: var(--accent); }
        #send-btn { background: var(--accent); color: black; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 12.5px; cursor: pointer; transition: 0.2s; }
        #send-btn:hover { opacity: 0.9; }
        
        /* Whiteboard Canvas & Grid */
        #whiteboard { background: #000; display: block; touch-action: none; cursor: crosshair; position: absolute; top:0; left:0; z-index: 1; }
        #grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: 35px 35px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            pointer-events: none;
            z-index: 2;
            display: none;
        }

        /* Responsive Mobile Dock Layout */
        @media (max-width: 768px) {
            .toolbar { 
                top: auto !important; 
                flex-wrap: nowrap; 
                overflow-x: auto; 
                -webkit-overflow-scrolling: touch; 
                justify-content: flex-start; 
                width: 95%; 
                left: 50% !important; 
                transform: translateX(-50%); 
                padding: 9px 12px;
                border-radius: 20px;
            }
            .toolbar::-webkit-scrollbar { display: none; } 
            
            #ui-left { bottom: 68px !important; } 
            #ui-right { bottom: 10px !important; } 
            .tool-btn, .action-btn { font-size: 12px; padding: 7px 11px; } 
            .size-wrapper input[type=range] { width: 55px; } 
            #shape-menu { top: auto; bottom: 130px; left: 50%; transform: translateX(-50%); width: 260px; }
            #chat-container { width: 92%; right: 4%; top: 65px; bottom: 130px; }
        }

        /* Ad Container */
        #ad-container { position: absolute; bottom: 0; width: 100%; height: 50px; text-align: center; z-index: 5; background: transparent; pointer-events: none; }
        #ad-container iframe { pointer-events: auto; }
        @media (max-width: 768px) { #ad-container { bottom: auto; top: 0; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Left Toolbar: Colors, Tools, Brush Size -->
    <div id="ui-left" class="toolbar">
        <div class="color-wrapper">
            <div class="color-btn white active-color" id="c-white" onclick="setColor('white')" title="White"></div>
            <div class="color-btn red" id="c-red" onclick="setColor('#ef4444')" title="Red"></div>
            <div class="color-btn green" id="c-green" onclick="setColor('#10b981')" title="Green"></div>
            <div class="color-btn blue" id="c-blue" onclick="setColor('#3b82f6')" title="Blue"></div>
            <input type="color" id="c-custom" class="color-picker-input" value="#f59e0b" oninput="setColor(this.value, true)" title="Custom Color">
        </div>
        <div class="divider"></div>
        <div class="tools-wrapper">
            <button class="tool-btn active-tool" id="t-pen" onclick="setTool('pen')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
                Pen
            </button>
            <button class="tool-btn" id="t-eraser" onclick="setTool('eraser')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"/><path d="M17 17L7 7"/></svg>
                Eraser
            </button>
            <button class="tool-btn" id="t-text" onclick="setTool('text')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                Text
            </button>
            <button class="tool-btn" id="t-shape" onclick="toggleShapeMenu()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                Shapes
            </button>
            <button class="tool-btn" id="t-grid" onclick="toggleGrid()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
                Grid
            </button>
        </div>
        <div class="divider"></div>
        <div class="size-wrapper">
            <span id="size-label">Size: 4px</span>
            <input type="range" id="size-slider" min="1" max="50" value="4" oninput="updateSize(this.value)">
        </div>
    </div>

    <!-- Shapes Popup Menu (Pure SVG + Text, No Emojis) -->
    <div id="shape-menu">
        <button class="shape-btn" onclick="selectShape('line')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="20" x2="20" y2="4"/></svg>
            Line
        </button>
        <button class="shape-btn" onclick="selectShape('rect')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
            Rectangle
        </button>
        <button class="shape-btn" onclick="selectShape('circle')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/></svg>
            Circle
        </button>
        <button class="shape-btn" onclick="selectShape('triangle')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 3 22 20 2 20"/></svg>
            Triangle
        </button>
        <button class="shape-btn" onclick="selectShape('arrow')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            Arrow
        </button>
        <button class="shape-btn" onclick="selectShape('diamond')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 2 22 12 12 22 2 12"/></svg>
            Diamond
        </button>
    </div>

    <!-- Right Toolbar: Room Info, Actions, Chat -->
    <div id="ui-right" class="toolbar">
        <button class="action-btn btn-room" id="room-display" onclick="changeRoom()" title="Click to switch Room">Room</button>
        <div class="divider"></div>
        <button class="action-btn" onclick="undo()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            Undo
        </button>
        <button class="action-btn" onclick="redo()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
            Redo
        </button>
        <button class="action-btn btn-save" onclick="saveToGallery()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Save
        </button>
        <button class="action-btn btn-clear" onclick="clearAll(true)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            Clear
        </button>
        <div class="divider"></div>
        <button class="action-btn btn-chat" onclick="toggleChat()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Chat
            <span id="chat-badge">0</span>
        </button>
    </div>

    <!-- Live Chat Panel -->
    <div id="chat-container">
        <div id="chat-header">
            <span id="chat-room-title">DDIRE Chat</span>
            <span class="close-chat-btn" onclick="toggleChat()">Close</span>
        </div>
        <div id="chat-messages">
            <div class="msg" style="align-self: center; background: transparent; color: #888; font-size: 11px;">Connected to DDIRE-PeerSolve</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Visual Grid Overlay -->
    <div id="grid-overlay"></div>

    <!-- Drawing Canvas -->
    <canvas id="whiteboard"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        let userName = localStorage.getItem('ddire_username');
        if (!userName) {
            userName = prompt("Welcome to DDIRE-PeerSolve! Please enter your Name:") || "Guest";
            localStorage.setItem('ddire_username', userName);
        }

        let roomId = prompt(`Hello ${userName}! Enter a Room Code to collaborate (e.g., 101):`);
        if (!roomId) roomId = "PublicRoom";

        document.getElementById('room-display').innerText = `Room: ${roomId}`;
        document.getElementById('chat-room-title').innerText = `Room: ${roomId}`;

        socket.emit('joinRoom', roomId);

        socket.on('roomFull', () => {
            alert("This Room is currently full (Maximum 2 users allowed). Please enter a different Room Code.");
            window.location.reload();
        });

        function changeRoom() {
            let newRoom = prompt("Enter a new Room Code to switch:");
            if (newRoom && newRoom.trim() !== "") {
                window.location.reload();
            }
        }

        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let color = 'white'; 
        let currentTool = 'pen'; 
        let currentShape = 'line'; 
        let showGrid = false;
        
        let startX = 0, startY = 0;
        let prevX = 0, prevY = 0; 
        let lastX = 0, lastY = 0; 
        let snapshot; 
        
        let penSize = 4;
        let eraserSize = 25;
        
        let history = [];
        let redoStack = [];

        let chatOpen = false;
        let unreadCount = 0;

        function setupCanvas() {
            const ratio = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * ratio;
            canvas.height = window.innerHeight * ratio;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.scale(ratio, ratio);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            fillBlackBackground();
        }

        function fillBlackBackground() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function toggleGrid() {
            showGrid = !showGrid;
            document.getElementById('grid-overlay').style.display = showGrid ? 'block' : 'none';
            document.getElementById('t-grid').classList.toggle('active-tool', showGrid);
        }

        function getCoords(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            let clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function saveToGallery() {
            const imageURL = canvas.toDataURL("image/png", 1.0);
            const link = document.createElement("a");
            link.href = imageURL;
            link.download = `DDIRE_Room_${roomId}_Board.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function toggleChat() {
            chatOpen = !chatOpen;
            document.getElementById('chat-container').style.display = chatOpen ? 'flex' : 'none';
            if (chatOpen) {
                unreadCount = 0;
                document.getElementById('chat-badge').style.display = 'none';
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const msgText = input.value.trim();
            if (msgText !== '') {
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML += `<div class="msg self"><span class="msg-sender">${userName}</span>${msgText}</div>`;
                input.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight; 
                socket.emit('chatMessage', { sender: userName, msg: msgText });
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        function toggleShapeMenu() {
            const menu = document.getElementById('shape-menu');
            menu.style.display = menu.style.display === 'grid' ? 'none' : 'grid';
        }

        function selectShape(shapeType) {
            currentShape = shapeType;
            setTool('shape');
            document.getElementById('shape-menu').style.display = 'none';
        }

        function updateUI() {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-color'));
            if(color === 'white') document.getElementById('c-white').classList.add('active-color');
            else if(color === '#ef4444') document.getElementById('c-red').classList.add('active-color');
            else if(color === '#10b981') document.getElementById('c-green').classList.add('active-color');
            else if(color === '#3b82f6') document.getElementById('c-blue').classList.add('active-color');

            document.querySelectorAll('.tool-btn').forEach(b => {
                if (b.id !== 't-grid') b.classList.remove('active-tool');
            });
            if (currentTool === 'shape') {
                document.getElementById('t-shape').classList.add('active-tool');
            } else {
                const toolBtn = document.getElementById('t-' + currentTool);
                if (toolBtn) toolBtn.classList.add('active-tool');
            }

            const slider = document.getElementById('size-slider');
            const label = document.getElementById('size-label');
            
            if(currentTool === 'eraser') {
                slider.value = eraserSize;
                label.innerText = `Size: ${eraserSize}px`;
                canvas.style.cursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/></svg>') 12 12, auto`;
            } else if (currentTool === 'text') {
                canvas.style.cursor = "text";
            } else {
                slider.value = penSize;
                label.innerText = `Size: ${penSize}px`;
                canvas.style.cursor = "crosshair";
            }
        }

        function setColor(c, isCustom = false) { 
            color = c; 
            if (currentTool !== 'shape' && currentTool !== 'text') setTool('pen'); 
            updateUI(); 
        }

        function setTool(t) { 
            currentTool = t; 
            document.getElementById('shape-menu').style.display = 'none'; 
            updateUI(); 
        }
        
        function updateSize(val) {
            if(currentTool === 'eraser') eraserSize = val;
            else penSize = val;
            document.getElementById('size-label').innerText = `Size: ${val}px`;
        }

        function saveState() {
            if (history.length > 30) history.shift(); 
            ctx.setTransform(1, 0, 0, 1, 0, 0); 
            history.push(canvas.toDataURL("image/png", 1.0));
            redoStack = []; 
            const ratio = window.devicePixelRatio || 1;
            ctx.scale(ratio, ratio); 
        }

        function loadState(dataUrl) {
            let img = new Image();
            img.src = dataUrl;
            img.onload = () => {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                const ratio = window.devicePixelRatio || 1;
                ctx.scale(ratio, ratio);
            };
        }

        function undo(emitSignal = true) { 
            if (history.length > 1) { 
                redoStack.push(history.pop()); 
                loadState(history[history.length - 1]); 
                if (emitSignal) socket.emit('undo');
            } 
        }

        function redo(emitSignal = true) { 
            if (redoStack.length > 0) { 
                let nextState = redoStack.pop(); 
                history.push(nextState); 
                loadState(nextState); 
                if (emitSignal) socket.emit('redo');
            } 
        }
        
        function clearAll(emitSignal = false) {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const ratio = window.devicePixelRatio || 1;
            ctx.scale(ratio, ratio);
            fillBlackBackground();
            saveState();
            if (emitSignal) socket.emit('clearCanvas');
        }

        function renderShape(shape, x0, y0, x1, y1, strokeColor, size) {
            ctx.beginPath();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (shape === 'line') {
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
            } else if (shape === 'rect') {
                ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
            } else if (shape === 'circle') {
                let radius = Math.sqrt(Math.pow(x1 - x0, 2) + Math.pow(y1 - y0, 2));
                ctx.arc(x0, y0, radius, 0, 2 * Math.PI);
            } else if (shape === 'triangle') {
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.lineTo(x0 - (x1 - x0), y1);
                ctx.closePath();
            } else if (shape === 'diamond') {
                let midX = (x0 + x1) / 2;
                let midY = (y0 + y1) / 2;
                ctx.moveTo(midX, y0);
                ctx.lineTo(x1, midY);
                ctx.lineTo(midX, y1);
                ctx.lineTo(x0, midY);
                ctx.closePath();
            } else if (shape === 'arrow') {
                let headlen = 14;
                let angle = Math.atan2(y1 - y0, x1 - x0);
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.lineTo(x1 - headlen * Math.cos(angle - Math.PI / 6), y1 - headlen * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(x1, y1);
                ctx.lineTo(x1 - headlen * Math.cos(angle + Math.PI / 6), y1 - headlen * Math.sin(angle + Math.PI / 6));
            }
            ctx.stroke();
        }

        function startAction(e) {
            if(e.target.closest('.toolbar') || e.target.closest('#chat-container') || e.target.closest('#shape-menu')) return;
            if (e.touches && e.touches.length > 1) return; 
            
            const coords = getCoords(e);
            
            if (currentTool === 'text') {
                let text = prompt("Enter text to place on the board:");
                if (text) {
                    ctx.fillStyle = color;
                    let fontSize = 24;
                    ctx.font = fontSize + "px 'Inter', 'Segoe UI', sans-serif";
                    ctx.fillText(text, coords.x, coords.y);
                    saveState();
                    socket.emit('drawText', { text: text, x: coords.x, y: coords.y, color: color, size: fontSize });
                }
                return; 
            }

            isDrawing = true;
            startX = coords.x;
            startY = coords.y;
            prevX = coords.x;
            prevY = coords.y;
            lastX = coords.x;
            lastY = coords.y;

            if (currentTool === 'shape') {
                snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
                return;
            }

            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
        }

        function moveAction(e) {
            if (!isDrawing || currentTool === 'text') return;
            e.preventDefault();

            const coords = getCoords(e);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'shape') {
                lastX = coords.x;
                lastY = coords.y;
                ctx.putImageData(snapshot, 0, 0); 
                renderShape(currentShape, startX, startY, coords.x, coords.y, color, penSize);
                return;
            }

            if (currentTool === 'eraser') {
                ctx.strokeStyle = 'black'; 
                ctx.lineWidth = eraserSize; 
            } else {
                ctx.strokeStyle = color;
                ctx.lineWidth = penSize; 
            }

            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();

            socket.emit('drawing', {
                x0: prevX, y0: prevY,
                x1: coords.x, y1: coords.y,
                color: ctx.strokeStyle, size: ctx.lineWidth
            });
            
            prevX = coords.x;
            prevY = coords.y;
        }

        function endAction(e) {
            if (isDrawing) {
                isDrawing = false;
                if (currentTool === 'shape') {
                    socket.emit('drawShape', {
                        shape: currentShape,
                        x0: startX, y0: startY,
                        x1: lastX, y1: lastY,
                        color: color, size: penSize
                    });
                }
                ctx.closePath();
                saveState();
            }
        }

        // REAL-TIME SERVER EVENTS
        socket.on('drawing', (data) => {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = data.color;
            ctx.lineWidth = data.size;
            ctx.beginPath();
            ctx.moveTo(data.x0, data.y0);
            ctx.lineTo(data.x1, data.y1);
            ctx.stroke();
            ctx.closePath();
        });

        socket.on('drawShape', (data) => {
            renderShape(data.shape, data.x0, data.y0, data.x1, data.y1, data.color, data.size);
            saveState(); 
        });

        socket.on('chatMessage', (data) => {
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML += `<div class="msg"><span class="msg-sender">${data.sender}</span>${data.msg}</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (!chatOpen) {
                unreadCount++;
                document.getElementById('chat-badge').innerText = unreadCount;
                document.getElementById('chat-badge').style.display = 'block';
            }
        });

        socket.on('drawText', (data) => {
            ctx.fillStyle = data.color;
            ctx.font = data.size + "px 'Inter', 'Segoe UI', sans-serif";
            ctx.fillText(data.text, data.x, data.y);
            saveState();
        });

        socket.on('clearCanvas', () => { clearAll(false); });
        socket.on('undo', () => { undo(false); });
        socket.on('redo', () => { redo(false); });
        
        canvas.addEventListener('mousedown', startAction);
        canvas.addEventListener('mousemove', moveAction);
        canvas.addEventListener('mouseup', endAction);
        canvas.addEventListener('mouseout', endAction);
        canvas.addEventListener('touchstart', startAction, { passive: false });
        canvas.addEventListener('touchmove', moveAction, { passive: false });
        canvas.addEventListener('touchend', endAction);

        setupCanvas();
        saveState(); 

        window.addEventListener('resize', () => {
            let lastState = history[history.length - 1];
            setupCanvas();
            if(lastState) loadState(lastState);
        });
    </script>
