<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DDIRE-PeerSolve - Premium Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="keywords" content="Peer Solve, Draw, Drawing Board, Real-time Whiteboard">
    <meta name="author" content="Ankur">
    <meta name="google-site-verification" content="6jiXl6s2IAC-aG8T4irxKVlaAU4hgpy3pNOG39xYv3U" />
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #000; 
            color: white; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Premium Glassmorphism Toolbars */
        .toolbar { 
            position: absolute; 
            top: 20px; 
            background: rgba(24, 24, 24, 0.92); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 15px; 
            border-radius: 40px; 
            border: 1px solid #383838; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 6px 25px rgba(0,0,0,0.7); 
            z-index: 10; 
            pointer-events: auto; 
        }
        #ui-left { left: 20px; max-width: calc(100vw - 40px); }
        #ui-right { right: 20px; max-width: calc(100vw - 40px); }
        
        .divider { width: 1px; height: 24px; background: #444; flex-shrink: 0; }
        
        /* Colors & Color Picker */
        .color-wrapper { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .color-btn { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; flex-shrink: 0; }
        .color-btn.white { background: #fff; }
        .color-btn.red { background: #e74c3c; }
        .color-btn.green { background: #2ecc71; }
        .color-btn.blue { background: #3498db; }
        .active-color { border: 2px solid #fff; transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.4); }
        
        .color-picker-input {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            padding: 0;
            background: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-input::-webkit-color-swatch { border: 2px solid #555; border-radius: 50%; }

        /* Tools & Action Buttons */
        .tools-wrapper { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .tool-btn, .action-btn { 
            background: #252525; 
            color: #ccc; 
            border: 1px solid #3a3a3a; 
            border-radius: 20px; 
            padding: 6px 13px; 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s; 
            white-space: nowrap; 
            flex-shrink: 0; 
        }
        .tool-btn:hover, .action-btn:hover { background: #333; color: white; }
        .active-tool { border-color: #2ecc71; color: #2ecc71; background: rgba(46, 204, 113, 0.15); }
        
        /* Shape Menu */
        #shape-menu { 
            display: none; 
            position: absolute; 
            top: 75px; 
            left: 200px; 
            background: rgba(26, 26, 26, 0.96); 
            padding: 10px; 
            border-radius: 15px; 
            border: 1px solid #444; 
            z-index: 20; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .shape-btn { background: #262626; border: 1px solid #444; color: white; padding: 10px 14px; border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 18px; display: flex; justify-content: center; align-items: center; }
        .shape-btn:hover { background: #2ecc71; color: black; border-color: #2ecc71; }
        
        /* Size Slider */
        .size-wrapper { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #aaa; flex-shrink: 0; }
        input[type=range] { -webkit-appearance: none; width: 75px; background: transparent; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #444; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #2ecc71; margin-top: -5px; }
        
        /* Special Button Colors */
        .btn-room { color: #f1c40f; border-color: rgba(241, 196, 15, 0.35); }
        .btn-room:hover { background: rgba(241, 196, 15, 0.15); }
        .btn-clear { color: #e74c3c; border-color: rgba(231, 76, 60, 0.35); }
        .btn-clear:hover { background: rgba(231, 76, 60, 0.15); }
        .btn-save { color: #3498db; border-color: rgba(52, 152, 219, 0.35); }
        .btn-save:hover { background: rgba(52, 152, 219, 0.15); }
        .btn-chat { border-color: #2ecc71; color: #2ecc71; display: flex; align-items: center; gap: 5px; position: relative; flex-shrink: 0;}
        
        /* Chat Container */
        #chat-container { position: absolute; right: 20px; top: 75px; bottom: 20px; width: 320px; background: #181818; border: 1px solid #333; border-radius: 15px; display: none; flex-direction: column; pointer-events: auto; z-index: 15; box-shadow: 0 10px 30px rgba(0,0,0,0.85); }
        #chat-header { background: #222; padding: 12px 15px; font-weight: bold; border-top-left-radius: 15px; border-top-right-radius: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .close-chat-btn { cursor: pointer; color: #aaa; font-size: 20px; padding: 0 8px; }
        .close-chat-btn:hover { color: #e74c3c; }
        
        #chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2c2c2c; padding: 8px 12px; border-radius: 10px; font-size: 13px; align-self: flex-start; max-width: 85%; word-wrap: break-word; }
        .msg.self { background: #2ecc71; color: black; align-self: flex-end; }
        .msg-sender { font-size: 10px; color: #aaa; margin-bottom: 3px; display: block; font-weight: 600; }
        .msg.self .msg-sender { color: #145c32; text-align: right; }
        #chat-input-area { display: flex; padding: 10px; border-top: 1px solid #333; gap: 8px; }
        #chat-input { flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; outline: none; font-size: 13px;}
        #chat-input:focus { border-color: #2ecc71; }
        #send-btn { background: #2ecc71; color: black; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* Whiteboard Canvas & Optional Grid */
        #whiteboard { background: #000; display: block; touch-action: none; cursor: crosshair; position: absolute; top:0; left:0; z-index: 1; }
        #grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: 35px 35px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            pointer-events: none;
            z-index: 2;
            display: none;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            .toolbar { 
                top: auto !important; 
                flex-wrap: nowrap; 
                overflow-x: auto; 
                -webkit-overflow-scrolling: touch; 
                justify-content: flex-start; 
                width: 95%; 
                left: 50% !important; 
                transform: translateX(-50%); 
                padding: 9px 12px;
                border-radius: 16px;
            }
            .toolbar::-webkit-scrollbar { display: none; } 
            
            #ui-left { bottom: 68px !important; } 
            #ui-right { bottom: 10px !important; } 
            .tool-btn, .action-btn { font-size: 12px; padding: 7px 11px; } 
            .size-wrapper input[type=range] { width: 55px; } 
            #shape-menu { top: auto; bottom: 125px; left: 50%; transform: translateX(-50%); }
            #chat-container { width: 90%; right: 5%; top: 65px; bottom: 130px; }
        }

        /* Safe Ad Container */
        #ad-container { position: absolute; bottom: 0; width: 100%; height: 50px; text-align: center; z-index: 5; background: transparent; pointer-events: none; }
        #ad-container iframe { pointer-events: auto; }
        @media (max-width: 768px) { #ad-container { bottom: auto; top: 0; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Left Toolbar: Colors, Tools, Brush Size -->
    <div id="ui-left" class="toolbar">
        <div class="color-wrapper">
            <div class="color-btn white active-color" id="c-white" onclick="setColor('white')" title="White"></div>
            <div class="color-btn red" id="c-red" onclick="setColor('#e74c3c')" title="Red"></div>
            <div class="color-btn green" id="c-green" onclick="setColor('#2ecc71')" title="Green"></div>
            <div class="color-btn blue" id="c-blue" onclick="setColor('#3498db')" title="Blue"></div>
            <input type="color" id="c-custom" class="color-picker-input" value="#f1c40f" oninput="setColor(this.value, true)" title="Custom Color">
        </div>
        <div class="divider"></div>
        <div class="tools-wrapper">
            <button class="tool-btn active-tool" id="t-pen" onclick="setTool('pen')">✏️ Pen</button>
            <button class="tool-btn" id="t-eraser" onclick="setTool('eraser')">🧽 Eraser</button>
            <button class="tool-btn" id="t-text" onclick="setTool('text')">🔤 Text</button>
            <button class="tool-btn" id="t-shape" onclick="toggleShapeMenu()">Shapes ▼</button>
            <button class="tool-btn" id="t-grid" onclick="toggleGrid()"># Grid</button>
        </div>
        <div class="divider"></div>
        <div class="size-wrapper">
            <span id="size-label">Size: 4px</span>
            <input type="range" id="size-slider" min="1" max="50" value="4" oninput="updateSize(this.value)">
        </div>
    </div>

    <!-- Shapes Popup Menu -->
    <div id="shape-menu">
        <button class="shape-btn" onclick="selectShape('line')" title="Line">➖</button>
        <button class="shape-btn" onclick="selectShape('rect')" title="Rectangle">⬜</button>
        <button class="shape-btn" onclick="selectShape('circle')" title="Circle">⭕</button>
        <button class="shape-btn" onclick="selectShape('triangle')" title="Triangle">🔺</button>
        <button class="shape-btn" onclick="selectShape('arrow')" title="Arrow">➡️</button>
        <button class="shape-btn" onclick="selectShape('diamond')" title="Diamond">🔷</button>
    </div>

    <!-- Right Toolbar: Room Info, Actions, Chat -->
    <div id="ui-right" class="toolbar">
        <button class="action-btn btn-room" id="room-display" onclick="changeRoom()" title="Click to switch Room">🔑 Room</button>
        <div class="divider"></div>
        <button class="action-btn" onclick="undo()">↩ Undo</button>
        <button class="action-btn" onclick="redo()">↪ Redo</button>
        <button class="action-btn btn-save" onclick="saveToGallery()">💾 Save</button>
        <button class="action-btn btn-clear" onclick="clearAll(true)">🗑️ Clear</button>
        <div class="divider"></div>
        <button class="action-btn btn-chat" onclick="toggleChat()">
            💬 Chat
            <span id="chat-badge" style="display:none; position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; padding:2px 6px; font-size:10px;">0</span>
        </button>
    </div>

    <!-- Live Chat Panel -->
    <div id="chat-container">
        <div id="chat-header">
            <span id="chat-room-title">DDIRE Chat</span>
            <span class="close-chat-btn" onclick="toggleChat()">✖</span>
        </div>
        <div id="chat-messages">
            <div class="msg" style="align-self: center; background: transparent; color: #888; font-size: 11px;">Welcome to DDIRE-PeerSolve!</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Visual Grid Overlay -->
    <div id="grid-overlay"></div>

    <!-- Drawing Canvas -->
    <canvas id="whiteboard"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // User Name & Room Setup (100% English)
        let userName = localStorage.getItem('ddire_username');
        if (!userName) {
            userName = prompt("Welcome to DDIRE-PeerSolve! Please enter your Name:") || "Guest";
            localStorage.setItem('ddire_username', userName);
        }

        let roomId = prompt(`Hi ${userName}! Enter a Room Code to connect with your partner (e.g., 101):`);
        if (!roomId) roomId = "PublicRoom";

        document.getElementById('room-display').innerText = `🔑 Room: ${roomId}`;
        document.getElementById('chat-room-title').innerText = `Chat (Room: ${roomId})`;

        socket.emit('joinRoom', roomId);

        socket.on('roomFull', () => {
            alert("This Room is currently full (Max 2 users allowed). Please enter a different Room Code.");
            window.location.reload();
        });

        function changeRoom() {
            let newRoom = prompt("Enter a new Room Code to switch:");
            if (newRoom && newRoom.trim() !== "") {
                window.location.reload();
            }
        }

        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let color = 'white'; 
        let currentTool = 'pen'; 
        let currentShape = 'line'; 
        let showGrid = false;
        
        let startX = 0, startY = 0;
        let prevX = 0, prevY = 0; 
        let lastX = 0, lastY = 0; 
        let snapshot; 
        
        let penSize = 4;
        let eraserSize = 25;
        
        let history = [];
        let redoStack = [];

        let chatOpen = false;
        let unreadCount = 0;

        function setupCanvas() {
            const ratio = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * ratio;
            canvas.height = window.innerHeight * ratio;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.scale(ratio, ratio);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            fillBlackBackground();
        }

        function fillBlackBackground() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function toggleGrid() {
            showGrid = !showGrid;
            document.getElementById('grid-overlay').style.display = showGrid ? 'block' : 'none';
            document.getElementById('t-grid').classList.toggle('active-tool', showGrid);
        }

        function getCoords(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            let clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function saveToGallery() {
            const imageURL = canvas.toDataURL("image/png", 1.0);
            const link = document.createElement("a");
            link.href = imageURL;
            link.download = `DDIRE_Room_${roomId}_Note.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function toggleChat() {
            chatOpen = !chatOpen;
            document.getElementById('chat-container').style.display = chatOpen ? 'flex' : 'none';
            if (chatOpen) {
                unreadCount = 0;
                document.getElementById('chat-badge').style.display = 'none';
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const msgText = input.value.trim();
            if (msgText !== '') {
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML += `<div class="msg self"><span class="msg-sender">${userName}</span>${msgText}</div>`;
                input.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight; 
                socket.emit('chatMessage', { sender: userName, msg: msgText });
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        function toggleShapeMenu() {
            const menu = document.getElementById('shape-menu');
            menu.style.display = menu.style.display === 'grid' ? 'none' : 'grid';
        }

        function selectShape(shapeType) {
            currentShape = shapeType;
            setTool('shape');
            document.getElementById('shape-menu').style.display = 'none';
        }

        function updateUI() {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-color'));
            if(color === 'white') document.getElementById('c-white').classList.add('active-color');
            else if(color === '#e74c3c') document.getElementById('c-red').classList.add('active-color');
            else if(color === '#2ecc71') document.getElementById('c-green').classList.add('active-color');
            else if(color === '#3498db') document.getElementById('c-blue').classList.add('active-color');

            document.querySelectorAll('.tool-btn').forEach(b => {
                if (b.id !== 't-grid') b.classList.remove('active-tool');
            });
            if (currentTool === 'shape') {
                document.getElementById('t-shape').classList.add('active-tool');
            } else {
                const toolBtn = document.getElementById('t-' + currentTool);
                if (toolBtn) toolBtn.classList.add('active-tool');
            }

            const slider = document.getElementById('size-slider');
            const label = document.getElementById('size-label');
            
            if(currentTool === 'eraser') {
                slider.value = eraserSize;
                label.innerText = `Size: ${eraserSize}px`;
                canvas.style.cursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/></svg>') 12 12, auto`;
            } else if (currentTool === 'text') {
                canvas.style.cursor = "text";
            } else {
                slider.value = penSize;
                label.innerText = `Size: ${penSize}px`;
                canvas.style.cursor = "crosshair";
            }
        }

        function setColor(c, isCustom = false) { 
            color = c; 
            if (currentTool !== 'shape' && currentTool !== 'text') setTool('pen'); 
            updateUI(); 
        }

        function setTool(t) { 
            currentTool = t; 
            document.getElementById('shape-menu').style.display = 'none'; 
            updateUI(); 
        }
        
        function updateSize(val) {
            if(currentTool === 'eraser') eraserSize = val;
            else penSize = val;
            document.getElementById('size-label').innerText = `Size: ${val}px`;
        }

        function saveState() {
            if (history.length > 30) history.shift(); 
            ctx.setTransform(1, 0, 0, 1, 0, 0); 
            history.push(canvas.toDataURL("image/png", 1.0));
            redoStack = []; 
            const ratio = window.devicePixelRatio || 1;
            ctx.scale(ratio, ratio); 
        }

        function loadState(dataUrl) {
            let img = new Image();
            img.src = dataUrl;
            img.onload = () => {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                const ratio = window.devicePixelRatio || 1;
                ctx.scale(ratio, ratio);
            };
        }

        function undo(emitSignal = true) { 
            if (history.length > 1) { 
                redoStack.push(history.pop()); 
                loadState(history[history.length - 1]); 
                if (emitSignal) socket.emit('undo');
            } 
        }

        function redo(emitSignal = true) { 
            if (redoStack.length > 0) { 
                let nextState = redoStack.pop(); 
                history.push(nextState); 
                loadState(nextState); 
                if (emitSignal) socket.emit('redo');
            } 
        }
        
        function clearAll(emitSignal = false) {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const ratio = window.devicePixelRatio || 1;
            ctx.scale(ratio, ratio);
            fillBlackBackground();
            saveState();
            if (emitSignal) socket.emit('clearCanvas');
        }

        function renderShape(shape, x0, y0, x1, y1, strokeColor, size) {
            ctx.beginPath();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (shape === 'line') {
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
            } else if (shape === 'rect') {
                ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
            } else if (shape === 'circle') {
                let radius = Math.sqrt(Math.pow(x1 - x0, 2) + Math.pow(y1 - y0, 2));
                ctx.arc(x0, y0, radius, 0, 2 * Math.PI);
            } else if (shape === 'triangle') {
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.lineTo(x0 - (x1 - x0), y1);
                ctx.closePath();
            } else if (shape === 'diamond') {
                let midX = (x0 + x1) / 2;
                let midY = (y0 + y1) / 2;
                ctx.moveTo(midX, y0);
                ctx.lineTo(x1, midY);
                ctx.lineTo(midX, y1);
                ctx.lineTo(x0, midY);
                ctx.closePath();
            } else if (shape === 'arrow') {
                let headlen = 14;
                let angle = Math.atan2(y1 - y0, x1 - x0);
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.lineTo(x1 - headlen * Math.cos(angle - Math.PI / 6), y1 - headlen * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(x1, y1);
                ctx.lineTo(x1 - headlen * Math.cos(angle + Math.PI / 6), y1 - headlen * Math.sin(angle + Math.PI / 6));
            }
            ctx.stroke();
        }

        function startAction(e) {
            if(e.target.closest('.toolbar') || e.target.closest('#chat-container') || e.target.closest('#shape-menu')) return;
            if (e.touches && e.touches.length > 1) return; 
            
            const coords = getCoords(e);
            
            if (currentTool === 'text') {
                let text = prompt("Enter text to place on the board:");
                if (text) {
                    ctx.fillStyle = color;
                    let fontSize = 24;
                    ctx.font = fontSize + "px 'Segoe UI', sans-serif";
                    ctx.fillText(text, coords.x, coords.y);
                    saveState();
                    socket.emit('drawText', { text: text, x: coords.x, y: coords.y, color: color, size: fontSize });
                }
                return; 
            }

            isDrawing = true;
            startX = coords.x;
            startY = coords.y;
            prevX = coords.x;
            prevY = coords.y;
            lastX = coords.x;
            lastY = coords.y;

            if (currentTool === 'shape') {
                snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
                return;
            }

            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
        }

        function moveAction(e) {
            if (!isDrawing || currentTool === 'text') return;
            e.preventDefault();

            const coords = getCoords(e);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'shape') {
                lastX = coords.x;
                lastY = coords.y;
                ctx.putImageData(snapshot, 0, 0); 
                renderShape(currentShape, startX, startY, coords.x, coords.y, color, penSize);
                return;
            }

            if (currentTool === 'eraser') {
                ctx.strokeStyle = 'black'; 
                ctx.lineWidth = eraserSize; 
            } else {
                ctx.strokeStyle = color;
                ctx.lineWidth = penSize; 
            }

            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();

            socket.emit('drawing', {
                x0: prevX, y0: prevY,
                x1: coords.x, y1: coords.y,
                color: ctx.strokeStyle, size: ctx.lineWidth
            });
            
            prevX = coords.x;
            prevY = coords.y;
        }

        function endAction(e) {
            if (isDrawing) {
                isDrawing = false;
                if (currentTool === 'shape') {
                    socket.emit('drawShape', {
                        shape: currentShape,
                        x0: startX, y0: startY,
                        x1: lastX, y1: lastY,
                        color: color, size: penSize
                    });
                }
                ctx.closePath();
                saveState();
            }
        }

        // REAL-TIME SERVER EVENTS
        socket.on('drawing', (data) => {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = data.color;
            ctx.lineWidth = data.size;
            ctx.beginPath();
            ctx.moveTo(data.x0, data.y0);
            ctx.lineTo(data.x1, data.y1);
            ctx.stroke();
            ctx.closePath();
        });

        socket.on('drawShape', (data) => {
            renderShape(data.shape, data.x0, data.y0, data.x1, data.y1, data.color, data.size);
            saveState(); 
        });

        socket.on('chatMessage', (data) => {
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML += `<div class="msg"><span class="msg-sender">${data.sender}</span>${data.msg}</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (!chatOpen) {
                unreadCount++;
                document.getElementById('chat-badge').innerText = unreadCount;
                document.getElementById('chat-badge').style.display = 'block';
            }
        });

        socket.on('drawText', (data) => {
            ctx.fillStyle = data.color;
            ctx.font = data.size + "px 'Segoe UI', sans-serif";
            ctx.fillText(data.text, data.x, data.y);
            saveState();
        });

        socket.on('clearCanvas', () => { clearAll(false); });
        socket.on('undo', () => { undo(false); });
        socket.on('redo', () => { redo(false); });
        
        canvas.addEventListener('mousedown', startAction);
        canvas.addEventListener('mousemove', moveAction);
        canvas.addEventListener('mouseup', endAction);
        canvas.addEventListener('mouseout', endAction);
        canvas.addEventListener('touchstart', startAction, { passive: false });
        canvas.addEventListener('touchmove', moveAction, { passive: false });
        canvas.addEventListener('touchend', endAction);

        setupCanvas();
        saveState(); 

        window.addEventListener('resize', () => {
            let lastState = history[history.length - 1];
            setupCanvas();
            if(lastState) loadState(lastState);
        });
    </script>
